<h2 mat-dialog-title><span class="dialog-glyph">&#9760;</span> {{ data.title }}</h2>

<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">{{ data.cancelLabel || 'Cancelar' }}</button>
  <button mat-raised-button color="warn" type="button" (click)="confirm()">{{ data.confirmLabel || 'Confirmar' }}</button>
</mat-dialog-actions>
