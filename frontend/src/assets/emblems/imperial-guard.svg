<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <radialGradient id="ig-bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#1e2016"/>
      <stop offset="100%" stop-color="#101208"/>
    </radialGradient>
    <radialGradient id="ig-glow" cx="50%" cy="45%" r="42%">
      <stop offset="0%" stop-color="#8b0000" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8b0000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ig-olive" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a9a5b"/>
      <stop offset="100%" stop-color="#4a5730"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="url(#ig-bg)"/>
  <circle cx="200" cy="140" r="110" fill="url(#ig-glow)"/>

  <circle cx="200" cy="140" r="88" fill="none" stroke="#d4af37" stroke-width="2" opacity="0.7"/>
  <g stroke="#d4af37" stroke-width="1.5" opacity="0.7">
    <line x1="200" y1="48" x2="200" y2="62"/>
    <line x1="200" y1="218" x2="200" y2="232"/>
    <line x1="108" y1="140" x2="122" y2="140"/>
    <line x1="278" y1="140" x2="292" y2="140"/>
  </g>

  <!-- crossed lasguns/bayonets over a regimental star -->
  <g fill="url(#ig-olive)" stroke="#1c1e12" stroke-width="1.5">
    <rect x="150" y="130" width="100" height="9" rx="2" transform="rotate(28 200 134)"/>
    <rect x="150" y="130" width="100" height="9" rx="2" transform="rotate(-28 200 134)"/>
    <polygon points="196,86 204,86 208,110 192,110" transform="rotate(28 200 134)"/>
    <polygon points="196,86 204,86 208,110 192,110" transform="rotate(-28 200 134)"/>
  </g>

  <!-- imperial star / cap badge -->
  <g fill="#d4af37" stroke="#5a4415" stroke-width="1">
    <path d="M200 158 l8 18 l20 2 l-15 14 l4 20 l-17 -11 l-17 11 l4 -20 l-15 -14 l20 -2 z"/>
  </g>

  <text x="200" y="252" text-anchor="middle" font-family="Cinzel, serif" font-size="15" fill="#d4af37" letter-spacing="2.5">ASTRA MILITARUM</text>
</svg>
