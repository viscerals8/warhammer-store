<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <radialGradient id="el-bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#161a30"/>
      <stop offset="100%" stop-color="#0d0f1c"/>
    </radialGradient>
    <radialGradient id="el-glow" cx="50%" cy="45%" r="42%">
      <stop offset="0%" stop-color="#3fc1c9" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#3fc1c9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="el-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7fe8e0"/>
      <stop offset="100%" stop-color="#2f8f8a"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="url(#el-bg)"/>
  <circle cx="200" cy="140" r="110" fill="url(#el-glow)"/>

  <!-- fine filigree rings -->
  <circle cx="200" cy="140" r="90" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.6"/>
  <circle cx="200" cy="140" r="82" fill="none" stroke="url(#el-teal)" stroke-width="1.5"/>

  <!-- 8-point rune star -->
  <g fill="url(#el-teal)" stroke="#d4af37" stroke-width="0.75">
    <path d="M200 66 L210 122 L266 132 L210 142 L200 198 L190 142 L134 132 L190 122 Z"/>
    <path d="M200 96 L206 132 L242 138 L206 144 L200 180 L194 144 L158 138 L194 132 Z" fill="#0d0f1c" stroke="none" opacity="0.5"/>
  </g>
  <circle cx="200" cy="132" r="7" fill="#d4af37"/>

  <!-- delicate corner filaments -->
  <g stroke="#7fe8e0" stroke-width="1" opacity="0.7">
    <path d="M60 60 q40 0 40 40" fill="none"/>
    <path d="M340 60 q-40 0 -40 40" fill="none"/>
    <path d="M60 240 q40 0 40 -40" fill="none"/>
    <path d="M340 240 q-40 0 -40 -40" fill="none"/>
  </g>

  <text x="200" y="252" text-anchor="middle" font-family="Cinzel, serif" font-size="17" fill="#7fe8e0" letter-spacing="3">ASURYANI</text>
</svg>
