<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <radialGradient id="nc-bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#0f1a12"/>
      <stop offset="100%" stop-color="#08100a"/>
    </radialGradient>
    <radialGradient id="nc-glow" cx="50%" cy="45%" r="42%">
      <stop offset="0%" stop-color="#39ff6a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#39ff6a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nc-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8d0c8"/>
      <stop offset="100%" stop-color="#5a645a"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="url(#nc-bg)"/>
  <circle cx="200" cy="140" r="110" fill="url(#nc-glow)"/>

  <circle cx="200" cy="140" r="90" fill="none" stroke="#39ff6a" stroke-width="1.5" opacity="0.5"/>
  <circle cx="200" cy="140" r="82" fill="none" stroke="url(#nc-metal)" stroke-width="2"/>

  <!-- necron skull / ankh hybrid -->
  <g fill="url(#nc-metal)" stroke="#0f1a12" stroke-width="1.5">
    <ellipse cx="200" cy="122" rx="30" ry="26"/>
    <rect x="188" y="140" width="24" height="40" rx="6"/>
    <rect x="176" y="152" width="48" height="10" rx="4"/>
  </g>
  <circle cx="189" cy="118" r="6" fill="#39ff6a" stroke="none"/>
  <circle cx="211" cy="118" r="6" fill="#39ff6a" stroke="none"/>

  <!-- glowing energy lines -->
  <g stroke="#39ff6a" stroke-width="1.5" opacity="0.8">
    <path d="M200 180 l0 20 M182 186 l-12 16 M218 186 l12 16" fill="none"/>
  </g>

  <text x="200" y="252" text-anchor="middle" font-family="Cinzel, serif" font-size="16" fill="#39ff6a" letter-spacing="3">THE ETERNAL DYNASTY</text>
</svg>
